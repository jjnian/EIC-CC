<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案 A · 选择工作空间</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: {
    ink: { 950:'#080A0E', 900:'#0C0F14', 850:'#10141B', 800:'#12161E', 750:'#161B25', 700:'#1C222E' },
    neon: { 300:'#67E8F9', 400:'#22D3EE', 500:'#06B6D4' },
  },
  fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','PingFang SC','Microsoft YaHei','sans-serif'] },
  boxShadow: { glow: '0 0 24px rgba(34,211,238,.18)' },
} } }
</script>
<style>
  body { font-family: Inter, ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #2A3242; border-radius: 4px; }
  .panel { background:#12161E; border:1px solid rgba(255,255,255,.06); border-radius:12px; }
  .ws-card { transition: transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s, box-shadow .18s; }
  .ws-card:hover { transform: translateY(-3px); border-color: rgba(34,211,238,.4); box-shadow: 0 0 24px rgba(34,211,238,.12); }
  .ws-card .ws-actions { opacity: 0; transition: opacity .15s; }
  .ws-card:hover .ws-actions { opacity: 1; }
  .ws-card .ws-enter { opacity: 0; transition: opacity .15s; }
  .ws-card:hover .ws-enter { opacity: 1; }
</style>
</head>
<body class="bg-ink-900 text-white/90">

<div class="relative flex min-h-screen flex-col items-center px-6 py-16">
  <!-- 返回方案画廊（不显眼） -->
  <a href="../index.html" class="absolute left-6 top-6 flex items-center gap-1.5 text-[12px] text-white/25 transition hover:text-cyan-300">
    <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i>返回方案画廊
  </a>

  <!-- 顶部 Logo 与标题 -->
  <div class="mb-10 flex flex-col items-center text-center">
    <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-cyan-400 to-blue-600 text-ink-950 shadow-glow">
      <i data-lucide="waypoints" class="h-7 w-7"></i>
    </div>
    <h1 class="text-2xl font-bold text-white">推演平台</h1>
    <p class="mt-1 text-[11px] tracking-widest text-white/25">EIC-CC · 业务血缘建模</p>
    <p class="mt-3 max-w-md text-[13.5px] leading-relaxed text-white/40">
      基于本体图谱的 AI 业务血缘建模 —— 选择一个工作空间开始，或新建一个。
    </p>
  </div>

  <!-- 工作空间卡片网格 -->
  <div class="grid w-full max-w-4xl gap-4 sm:grid-cols-2 lg:grid-cols-3">

    <!-- 卡片 1：电商数仓（当前激活 / 默认） -->
    <a href="dashboard.html" class="ws-card panel group relative flex flex-col p-5">
      <span class="absolute -top-2.5 left-4 flex items-center gap-1 rounded-full bg-cyan-400/15 px-2.5 py-0.5 text-[10.5px] font-medium text-cyan-300 ring-1 ring-cyan-400/30">
        <i data-lucide="check-circle-2" class="h-3 w-3"></i>当前使用
      </span>
      <div class="ws-actions absolute right-3 top-3 flex items-center gap-1">
        <button title="重命名" class="rounded-md p-1.5 text-white/30 transition hover:bg-white/8 hover:text-white/80" onclick="event.preventDefault()"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
        <button title="删除工作空间" class="rounded-md p-1.5 text-white/30 transition hover:bg-rose-400/10 hover:text-rose-300" onclick="event.preventDefault()"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
      </div>
      <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-lg bg-cyan-400/10 text-cyan-300 ring-1 ring-cyan-400/20">
        <i data-lucide="layers" class="h-4.5 w-4.5"></i>
      </div>
      <div class="text-[15px] font-semibold text-white">电商数仓</div>
      <div class="mt-1 line-clamp-2 min-h-[36px] text-[12.5px] leading-relaxed text-white/35">交易、订单、支付核心链路的血缘建模与指标梳理</div>
      <div class="mt-4 flex items-center gap-3 text-[11.5px] text-white/30">
        <span class="flex items-center gap-1"><i data-lucide="waypoints" class="h-3 w-3"></i>3 个模型</span>
        <span class="flex items-center gap-1"><i data-lucide="box" class="h-3 w-3"></i>128 节点</span>
      </div>
      <div class="mt-3 flex items-center justify-between border-t border-white/5 pt-3 text-[11.5px] text-white/25">
        <span class="flex items-center gap-1"><i data-lucide="clock" class="h-3 w-3"></i>2 小时前更新</span>
        <span class="ws-enter flex items-center gap-1 font-medium text-cyan-300">进入 <i data-lucide="arrow-right" class="h-3.5 w-3.5"></i></span>
      </div>
    </a>

    <!-- 卡片 2：营销域 -->
    <a href="dashboard.html" class="ws-card panel group relative flex flex-col p-5">
      <div class="ws-actions absolute right-3 top-3 flex items-center gap-1">
        <button title="重命名" class="rounded-md p-1.5 text-white/30 transition hover:bg-white/8 hover:text-white/80" onclick="event.preventDefault()"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
        <button title="删除工作空间" class="rounded-md p-1.5 text-white/30 transition hover:bg-rose-400/10 hover:text-rose-300" onclick="event.preventDefault()"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
      </div>
      <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-lg bg-violet-400/10 text-violet-300 ring-1 ring-violet-400/20">
        <i data-lucide="megaphone" class="h-4.5 w-4.5"></i>
      </div>
      <div class="text-[15px] font-semibold text-white/90">营销域</div>
      <div class="mt-1 line-clamp-2 min-h-[36px] text-[12.5px] leading-relaxed text-white/35">投放、触达与归因分析的业务血缘图谱</div>
      <div class="mt-4 flex items-center gap-3 text-[11.5px] text-white/30">
        <span class="flex items-center gap-1"><i data-lucide="waypoints" class="h-3 w-3"></i>2 个模型</span>
        <span class="flex items-center gap-1"><i data-lucide="box" class="h-3 w-3"></i>42 节点</span>
      </div>
      <div class="mt-3 flex items-center justify-between border-t border-white/5 pt-3 text-[11.5px] text-white/25">
        <span class="flex items-center gap-1"><i data-lucide="clock" class="h-3 w-3"></i>昨天更新</span>
        <span class="ws-enter flex items-center gap-1 font-medium text-cyan-300">进入 <i data-lucide="arrow-right" class="h-3.5 w-3.5"></i></span>
      </div>
    </a>

    <!-- 卡片 3：用户域 -->
    <a href="dashboard.html" class="ws-card panel group relative flex flex-col p-5">
      <div class="ws-actions absolute right-3 top-3 flex items-center gap-1">
        <button title="重命名" class="rounded-md p-1.5 text-white/30 transition hover:bg-white/8 hover:text-white/80" onclick="event.preventDefault()"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
        <button title="删除工作空间" class="rounded-md p-1.5 text-white/30 transition hover:bg-rose-400/10 hover:text-rose-300" onclick="event.preventDefault()"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
      </div>
      <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-lg bg-blue-400/10 text-blue-300 ring-1 ring-blue-400/20">
        <i data-lucide="users" class="h-4.5 w-4.5"></i>
      </div>
      <div class="text-[15px] font-semibold text-white/90">用户域</div>
      <div class="mt-1 line-clamp-2 min-h-[36px] text-[12.5px] leading-relaxed text-white/35">会员、画像与行为数据的血缘梳理（构建中）</div>
      <div class="mt-4 flex items-center gap-3 text-[11.5px] text-white/30">
        <span class="flex items-center gap-1"><i data-lucide="waypoints" class="h-3 w-3"></i>1 个模型</span>
        <span class="flex items-center gap-1"><i data-lucide="box" class="h-3 w-3"></i>31 节点</span>
      </div>
      <div class="mt-3 flex items-center justify-between border-t border-white/5 pt-3 text-[11.5px] text-white/25">
        <span class="flex items-center gap-1"><i data-lucide="clock" class="h-3 w-3"></i>3 天前更新</span>
        <span class="ws-enter flex items-center gap-1 font-medium text-cyan-300">进入 <i data-lucide="arrow-right" class="h-3.5 w-3.5"></i></span>
      </div>
    </a>

    <!-- 卡片 4：信贷风控（空空间 / 暂无描述） -->
    <a href="dashboard.html" class="ws-card panel group relative flex flex-col p-5">
      <div class="ws-actions absolute right-3 top-3 flex items-center gap-1">
        <button title="重命名" class="rounded-md p-1.5 text-white/30 transition hover:bg-white/8 hover:text-white/80" onclick="event.preventDefault()"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
        <button title="删除工作空间" class="rounded-md p-1.5 text-white/30 transition hover:bg-rose-400/10 hover:text-rose-300" onclick="event.preventDefault()"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
      </div>
      <div class="mb-3 flex h-10 w-10 items-center justify-center rounded-lg bg-emerald-400/10 text-emerald-300 ring-1 ring-emerald-400/20">
        <i data-lucide="shield-check" class="h-4.5 w-4.5"></i>
      </div>
      <div class="text-[15px] font-semibold text-white/90">信贷风控</div>
      <div class="mt-1 line-clamp-2 min-h-[36px] text-[12.5px] leading-relaxed text-white/25">暂无描述</div>
      <div class="mt-4 flex items-center gap-3 text-[11.5px] text-white/30">
        <span class="flex items-center gap-1"><i data-lucide="waypoints" class="h-3 w-3"></i>0 个模型</span>
        <span class="flex items-center gap-1"><i data-lucide="box" class="h-3 w-3"></i>0 节点</span>
      </div>
      <div class="mt-3 flex items-center justify-between border-t border-white/5 pt-3 text-[11.5px] text-white/25">
        <span class="flex items-center gap-1"><i data-lucide="clock" class="h-3 w-3"></i>上周更新</span>
        <span class="ws-enter flex items-center gap-1 font-medium text-cyan-300">进入 <i data-lucide="arrow-right" class="h-3.5 w-3.5"></i></span>
      </div>
    </a>

    <!-- 新建工作空间入口卡片 -->
    <button class="flex min-h-[196px] flex-col items-center justify-center gap-2.5 rounded-xl border-2 border-dashed border-white/10 text-white/30 transition hover:border-cyan-400/50 hover:text-cyan-300 hover:shadow-glow">
      <div class="flex h-10 w-10 items-center justify-center rounded-full bg-white/[.04] ring-1 ring-white/10">
        <i data-lucide="plus" class="h-5 w-5"></i>
      </div>
      <span class="text-[13.5px] font-medium">新建工作空间</span>
      <span class="text-[11px] text-white/20">名称 + 可选描述，创建后直接进入</span>
    </button>
  </div>

  <!-- 底部提示 -->
  <div class="mt-10 flex items-center gap-2 text-[11.5px] text-white/20">
    <i data-lucide="info" class="h-3.5 w-3.5"></i>
    工作空间用于隔离不同业务域的模型、经验与数据源配置
  </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
