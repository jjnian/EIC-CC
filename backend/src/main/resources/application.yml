spring:
  application:
    name: tuiyan-backend
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 放宽到 60MB/120MB，容纳音频等较大的数据源文件
      max-file-size: 60MB
      max-request-size: 120MB
  # PostgreSQL 数据源：用户需自行准备 PgSQL 实例并执行 init.sql 建表
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tuiyan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  # 启动时自动执行 init.sql（脚本幂等，可重复运行）：用于新部署建表 + 老库的轻量迁移
  # enabled=false 可整体跳过执行（环境变量 DB_INIT_SCHEMA=false 同样生效）
  sql:
    init:
      enabled: ${DB_INIT_SCHEMA:true}
      mode: always
      schema-locations: classpath:sql/init.sql
      continue-on-error: false

server:
  port: 8000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id      # 主键由业务代码生成（保留 om_xxx / sc_xxx 等命名）
      logic-delete-field: null


app:
  data:
    dir: ${user.home}/.tuiyan
  # 对象存储（MinIO）：数据源原文件（pdf/docx/txt/音频等）与抽取文本统一落桶
  # 本地起一个 MinIO：docker run -p 9000:9000 -p 9001:9001 \
  #   -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
  #   quay.io/minio/minio server /data --console-address ":9001"
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:tuiyan}
  llm:
    models:
      # DeepSeek V4 Flash：速度优先的主力模型（deepseek-chat 老名 2026-07-24 下线，已升级到 v4-flash）
      - id: deepseek-flash
        name: DeepSeek V4 Flash
        provider: deepseek
        base-url: https://api.deepseek.com
        model-name: deepseek-v4-flash
        api-key: ${DEEPSEEK_API_KEY:sk-8fc96b5d37f5431b8392988afd9181f2}
        protocol: openai
        enabled: true
        context-window: 128000
        max-output-tokens: 8192
        capabilities:
          - streaming
          - json
          - tools
      # DeepSeek V4 Pro：复杂推理 / 长 JSON 抽取场景使用
      - id: deepseek-pro
        name: DeepSeek V4 Pro
        provider: deepseek
        base-url: https://api.deepseek.com
        model-name: deepseek-v4-pro
        api-key: ${DEEPSEEK_API_KEY:sk-8fc96b5d37f5431b8392988afd9181f2}
        protocol: openai
        enabled: true
        context-window: 128000
        max-output-tokens: 8192
        capabilities:
          - streaming
          - json
          - tools
      # 音频转写 (ASR) 模型：在 capabilities 中声明 `asr` 即被识别为「音频转文字」专用模型。
      # 调用 OpenAI 兼容的 /audio/transcriptions 端点；与对话模型走同一套管理，无需 app.asr 单配。
      # 示例为 OpenAI Whisper，可替换为通义千问 / 阿里云 paraformer / 自部署 whisper 等。
      - id: whisper-1
        name: Whisper (音频转文字)
        provider: openai
        base-url: ${ASR_BASE_URL:https://api.openai.com/v1}
        model-name: ${ASR_MODEL:whisper-1}
        api-key: ${ASR_API_KEY:}
        protocol: openai
        enabled: ${ASR_ENABLED:false}     # 默认关闭，填好 api-key 后再设为 true
        capabilities:
          - asr

  # 旧的 ASR 兼容配置：仅当 app.llm.models 中没有 capability=asr 的模型时才会被使用。
  # 推荐通过上方 llm.models 配置音频模型；这里保留是为了向后兼容旧部署。
  asr:
    enabled: ${ASR_ENABLED:true}
    base-url: ${ASR_BASE_URL:}
    api-key: ${ASR_API_KEY:}
    model: ${ASR_MODEL:whisper-1}
    language: ${ASR_LANGUAGE:}
    timestamps: ${ASR_TIMESTAMPS:false}


