app:
  data:
    dir: ${user.home}/.tuiyan
  embedding:
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    dimension: ${EMBEDDING_DIMENSION:1536}
    chunk-size: ${EMBEDDING_CHUNK_SIZE:500}
    chunk-overlap: ${EMBEDDING_CHUNK_OVERLAP:50}
  llm:
    models:
      - id: claude-opus-4-7
        name: Claude Opus 4.7 (中转站)
        provider: anthropic
        base-url: https://code.ppchat.vip
        model-name: claude-opus-4-7
        api-key: ${ANTHROPIC_API_KEY:}
        protocol: anthropic
        enabled: true
        context-window: 200000
        max-output-tokens: 32768
        capabilities:
          - json

