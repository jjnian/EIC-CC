app:
  data:
    dir: ${user.home}/.tuiyan
  llm:
    models:
      - id: claude-opus-4-7
        name: Claude Opus 4.7 (中转站)
        provider: anthropic
        base-url: https://code.ppchat.vip
        model-name: claude-opus-4-7
        api-key: ${ANTHROPIC_API_KEY:sk-}
        protocol: anthropic
        enabled: true
        context-window: 200000
        max-output-tokens: 32768
        capabilities:
          - json

