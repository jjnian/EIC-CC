spring:
  application:
    name: tuiyan-backend
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 80MB
  # PostgreSQL 数据源：用户需自行准备 PgSQL 实例并执行 init.sql 建表
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tuiyan}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  # 启动时自动执行 init.sql（脚本幂等，可重复运行）：用于新部署建表 + 老库的轻量迁移
  # enabled=false 可整体跳过执行（环境变量 DB_INIT_SCHEMA=false 同样生效）
  sql:
    init:
      enabled: ${DB_INIT_SCHEMA:true}
      mode: always
      schema-locations: classpath:sql/init.sql
      continue-on-error: false

server:
  port: 8000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id      # 主键由业务代码生成（保留 om_xxx / sc_xxx 等命名）
      logic-delete-field: null


app:
  data:
    dir: ${user.home}/.tuiyan
  llm:
    models:
      # DeepSeek V4 Flash：速度优先的主力模型（deepseek-chat 老名 2026-07-24 下线，已升级到 v4-flash）
      - id: deepseek-flash
        name: DeepSeek V4 Flash
        provider: deepseek
        base-url: https://api.deepseek.com
        model-name: deepseek-v4-flash
        api-key: ${DEEPSEEK_API_KEY:sk-8fc96b5d37f5431b8392988afd9181f2}
        protocol: openai
        enabled: true
        context-window: 128000
        max-output-tokens: 8192
        capabilities:
          - streaming
          - json
          - tools
      # DeepSeek V4 Pro：复杂推理 / 长 JSON 抽取场景使用
      - id: deepseek-pro
        name: DeepSeek V4 Pro
        provider: deepseek
        base-url: https://api.deepseek.com
        model-name: deepseek-v4-pro
        api-key: ${DEEPSEEK_API_KEY:sk-8fc96b5d37f5431b8392988afd9181f2}
        protocol: openai
        enabled: true
        context-window: 128000
        max-output-tokens: 8192
        capabilities:
          - streaming
          - json
          - tools

  # 音频转写 (ASR)：OpenAI 兼容的 /audio/transcriptions。音频会先转写成文本，再走文档抽取链路。
  # base-url / api-key 留空则回退用上面 app.llm 第一个模型的配置——仅当该提供商支持音频转写
  # （如 OpenAI、通义千问 compatible-mode）才有效；DeepSeek 不提供该接口，需在此单独配置。
  asr:
    enabled: ${ASR_ENABLED:true}
    base-url: ${ASR_BASE_URL:}
    api-key: ${ASR_API_KEY:}
    model: ${ASR_MODEL:whisper-1}
    language: ${ASR_LANGUAGE:}
    timestamps: ${ASR_TIMESTAMPS:false}


